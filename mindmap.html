<g class="mm-root"><rect x="816.0" y="995.2" width="250.0" height="131.0" rx="16" fill="#22252a" stroke="#22252a" stroke-width="1.3"></rect></g><g><rect x="416.0" y="524.5" width="250.0" height="78.0" rx="10" fill="#F0F1E2" stroke="#7C8552" stroke-width="1.3"></rect><text x="434.0" y="549.1" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#42472A" text-anchor="start"><tspan x="434.0" dy="0">Use cases</tspan></text><text x="434.0" y="564.8" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#42472A" text-anchor="start"><tspan x="434.0" dy="0">16 use cases, and their</tspan><tspan x="434.0" dy="15">use case details</tspan></text></g><g><rect x="40.0" y="0.0" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="0.0" width="4" height="53.0" fill="#1D9E75"></rect><text x="54.0" y="20.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Developers can see the API keys in Vault” —</tspan><tspan x="54.0" dy="16.5">really a model-access problem → Pattern C</tspan></text></g><g><rect x="40.0" y="65.0" width="320" height="86.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="65.0" width="4" height="86.0" fill="#1D9E75"></rect><text x="54.0" y="85.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Our model provider accepts our workload</tspan><tspan x="54.0" dy="16.5">identity directly — do we still need Vault?” —</tspan><tspan x="54.0" dy="16.5">federation removes the provider key, not the</tspan><tspan x="54.0" dy="16.5">other credentials → Patterns C and F</tspan></text></g><g><rect x="40.0" y="163.0" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="163.0" width="4" height="53.0" fill="#1D9E75"></rect><text x="54.0" y="183.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Control how much our agents spend on models”</tspan><tspan x="54.0" dy="16.5">— a gateway concern → Pattern C</tspan></text></g><g><rect x="40.0" y="228.0" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="228.0" width="4" height="53.0" fill="#1D9E75"></rect><text x="54.0" y="248.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Restrict which tools our agents can call” —</tspan><tspan x="54.0" dy="16.5">same architecture as model access → Pattern C</tspan></text></g><g><rect x="40.0" y="293.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="293.0" width="4" height="69.5" fill="#7F77DD"></rect><text x="54.0" y="313.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Our agents need to talk to each other</tspan><tspan x="54.0" dy="16.5">securely” — almost always delegation → Pattern</tspan><tspan x="54.0" dy="16.5">B</tspan></text></g><g><rect x="40.0" y="374.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="374.5" width="4" height="69.5" fill="#888780"></rect><text x="54.0" y="394.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“We need agent identity, not machine identity”</tspan><tspan x="54.0" dy="16.5">— could mean attestation, governance, or trust</tspan><tspan x="54.0" dy="16.5">— ask which</tspan></text></g><g><rect x="40.0" y="456.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="456.0" width="4" height="69.5" fill="#378ADD"></rect><text x="54.0" y="476.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Our agents run unattended, with no person</tspan><tspan x="54.0" dy="16.5">involved” — autonomous operation, still</tspan><tspan x="54.0" dy="16.5">governed → Pattern A</tspan></text></g><g><rect x="40.0" y="537.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="537.5" width="4" height="53.0" fill="#378ADD"></rect><text x="54.0" y="557.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“An agent needs a secret on behalf of a user”</tspan><tspan x="54.0" dy="16.5">— delegated access → Pattern A</tspan></text></g><g><rect x="40.0" y="602.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="602.5" width="4" height="53.0" fill="#378ADD"></rect><text x="54.0" y="622.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Our Vault team wants its own limit on what</tspan><tspan x="54.0" dy="16.5">agents reach” → Pattern A</tspan></text></g><g><rect x="40.0" y="667.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="667.5" width="4" height="53.0" fill="#D85A30"></rect><text x="54.0" y="687.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“We’re worried about prompt injection” — a</tspan><tspan x="54.0" dy="16.5">behavior control → Pattern E</tspan></text></g><g><rect x="40.0" y="732.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="732.5" width="4" height="53.0" fill="#D85A30"></rect><text x="54.0" y="752.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Stop sensitive data appearing in agent</tspan><tspan x="54.0" dy="16.5">responses” → Pattern E</tspan></text></g><g><rect x="40.0" y="797.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="797.5" width="4" height="53.0" fill="#639922"></rect><text x="54.0" y="817.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Coding assistants — we don’t know what they</tspan><tspan x="54.0" dy="16.5">can reach” → Pattern D</tspan></text></g><g><rect x="40.0" y="862.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="862.5" width="4" height="53.0" fill="#378ADD"></rect><text x="54.0" y="882.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“We need to know which agent did what, and for</tspan><tspan x="54.0" dy="16.5">whom” → Patterns A and B</tspan></text></g><g><rect x="40.0" y="927.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="927.5" width="4" height="53.0" fill="#888780"></rect><text x="54.0" y="947.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Agents shouldn’t hold long-lived credentials”</tspan><tspan x="54.0" dy="16.5">→ a capability, not a pattern</tspan></text></g><g><rect x="40.0" y="992.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="992.5" width="4" height="53.0" fill="#888780"></rect><text x="54.0" y="1012.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“Someone should approve before an agent does</tspan><tspan x="54.0" dy="16.5">anything risky” → a capability, not a pattern</tspan></text></g><g><rect x="40.0" y="1057.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1057.5" width="4" height="69.5" fill="#378ADD"></rect><text x="54.0" y="1077.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">“We have a lot of agents and no clear picture</tspan><tspan x="54.0" dy="16.5">of what exists” → Pattern A, plus an open</tspan><tspan x="54.0" dy="16.5">question</tspan></text></g><g><rect x="416.0" y="1270.0" width="250.0" height="96.0" rx="10" fill="#F3ECE3" stroke="#8A6A45" stroke-width="1.3"></rect><text x="434.0" y="1294.6" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#4A3720" text-anchor="start"><tspan x="434.0" dy="0">Capabilities across</tspan><tspan x="434.0" dy="18">patterns</tspan></text><text x="434.0" y="1328.3" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#4A3720" text-anchor="start"><tspan x="434.0" dy="0">Often mistaken for patterns of</tspan><tspan x="434.0" dy="15">their own</tspan></text></g><g><rect x="40.0" y="1161.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1161.0" width="4" height="69.5" fill="#8A6A45"></rect><text x="54.0" y="1181.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">Human approval: CIBA asks the person, Vault’s</tspan><tspan x="54.0" dy="16.5">Control Groups ask about the specific request</tspan><tspan x="54.0" dy="16.5">— different teams own each</tspan></text></g><g><rect x="40.0" y="1242.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1242.5" width="4" height="69.5" fill="#8A6A45"></rect><text x="54.0" y="1262.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">Attribution and audit: automatic wherever a</tspan><tspan x="54.0" dy="16.5">token carries both identities (Patterns A and</tspan><tspan x="54.0" dy="16.5">B)</tspan></text></g><g><rect x="40.0" y="1324.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1324.0" width="4" height="69.5" fill="#8A6A45"></rect><text x="54.0" y="1344.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">Dynamic credentials: created at the moment of</tspan><tspan x="54.0" dy="16.5">use, revoked via their lease — used in</tspan><tspan x="54.0" dy="16.5">Patterns A, D and F</tspan></text></g><g><rect x="40.0" y="1405.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1405.5" width="4" height="69.5" fill="#8A6A45"></rect><text x="54.0" y="1425.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">Secrets sync: for code that can’t call Vault</tspan><tspan x="54.0" dy="16.5">directly — weaker, since the destination</tspan><tspan x="54.0" dy="16.5">platform then controls the secret</tspan></text></g><g><rect x="416.0" y="1569.0" width="250.0" height="96.0" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.3"></rect><text x="434.0" y="1593.6" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#633806" text-anchor="start"><tspan x="434.0" dy="0">Questions the docs don’t</tspan><tspan x="434.0" dy="18">answer</tspan></text><text x="434.0" y="1627.3" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#633806" text-anchor="start"><tspan x="434.0" dy="0">Raise these before the user</tspan><tspan x="434.0" dy="15">finds them</tspan></text></g><g><rect x="40.0" y="1509.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1509.0" width="4" height="69.5" fill="#BA7517"></rect><text x="54.0" y="1529.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">Who builds the Rich Authorization Request, and</tspan><tspan x="54.0" dy="16.5">what it protects against — bugs, not a</tspan><tspan x="54.0" dy="16.5">compromised execution layer</tspan></text></g><g><rect x="40.0" y="1590.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1590.5" width="4" height="53.0" fill="#BA7517"></rect><text x="54.0" y="1610.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">Agent onboarding at scale: two systems, two</tspan><tspan x="54.0" dy="16.5">teams, unproven past tens of agents</tspan></text></g><g><rect x="40.0" y="1655.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1655.5" width="4" height="69.5" fill="#BA7517"></rect><text x="54.0" y="1675.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">How workload identity (Pattern F) and agent</tspan><tspan x="54.0" dy="16.5">governance (Pattern A) join up — nothing</tspan><tspan x="54.0" dy="16.5">connects them today</tspan></text></g><g><rect x="416.0" y="1892.2" width="250.0" height="96.0" rx="10" fill="#E9EDF3" stroke="#5B6B84" stroke-width="1.3"></rect><text x="434.0" y="1916.8" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#2E3A4C" text-anchor="start"><tspan x="434.0" dy="0">Limits to state in a</tspan>
<tspan x="1234.0" dy="18">meeting</tspan></text><text x="434.0" y="1950.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#2E3A4C" text-anchor="start"><tspan x="434.0" dy="0">Credibility comes from naming</tspan><tspan x="434.0" dy="15">the limits first</tspan></text></g><g><rect x="40.0" y="1759.0" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1759.0" width="4" height="53.0" fill="#5B6B84"></rect><text x="54.0" y="1779.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">The identity provider issues the delegated</tspan><tspan x="54.0" dy="16.5">token, not Vault</tspan></text></g><g><rect x="40.0" y="1824.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1824.0" width="4" height="69.5" fill="#5B6B84"></rect><text x="54.0" y="1844.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">The registered agent is the execution layer,</tspan><tspan x="54.0" dy="16.5">not the language model — credentials stop</tspan><tspan x="54.0" dy="16.5">there too</tspan></text></g><g><rect x="40.0" y="1905.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1905.5" width="4" height="69.5" fill="#5B6B84"></rect><text x="54.0" y="1925.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">Three authority models exist and aren’t</tspan><tspan x="54.0" dy="16.5">interchangeable — autonomous, on-behalf-of,</tspan><tspan x="54.0" dy="16.5">and with a Rich Authorization Request</tspan></text></g><g><rect x="40.0" y="1987.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="1987.0" width="4" height="69.5" fill="#5B6B84"></rect><text x="54.0" y="2007.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">A Rich Authorization Request guards against</tspan><tspan x="54.0" dy="16.5">defects, not against a compromised execution</tspan><tspan x="54.0" dy="16.5">layer</tspan></text></g><g><rect x="40.0" y="2068.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="40.0" y="2068.5" width="4" height="53.0" fill="#5B6B84"></rect><text x="54.0" y="2088.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="54.0" dy="0">Vault cannot let someone read a secret without</tspan><tspan x="54.0" dy="16.5">seeing its value</tspan></text></g><g><rect x="1216.0" y="158.0" width="250.0" height="96.0" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.3"></rect><text x="1234.0" y="182.6" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0C447C" text-anchor="start"><tspan x="1234.0" dy="0">Pattern A — Governed</tspan><tspan x="1234.0" dy="18">agent access to Vault</tspan></text><text x="1234.0" y="216.3" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#0C447C" text-anchor="start"><tspan x="1234.0" dy="0">Three authority models, one</tspan><tspan x="1234.0" dy="15">registry</tspan></text></g><g><rect x="1522.0" y="0.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="0.0" width="4" height="69.5" fill="#378ADD"></rect><text x="1536.0" y="20.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Autonomous — the token names the agent only;</tspan><tspan x="1536.0" dy="16.5">no person is involved, and there’s no human</tspan><tspan x="1536.0" dy="16.5">accountability</tspan></text></g><g><rect x="1522.0" y="81.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="81.5" width="4" height="53.0" fill="#378ADD"></rect><text x="1536.0" y="101.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">On behalf of a person — the token names the</tspan><tspan x="1536.0" dy="16.5">person as subject and the agent as actor</tspan></text></g><g><rect x="1522.0" y="146.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="146.5" width="4" height="69.5" fill="#378ADD"></rect><text x="1536.0" y="166.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">On behalf of a person, with a Rich</tspan><tspan x="1536.0" dy="16.5">Authorization Request — adds a per-request</tspan><tspan x="1536.0" dy="16.5">constraint on top</tspan></text></g><g><rect x="1522.0" y="228.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="228.0" width="4" height="69.5" fill="#378ADD"></rect><text x="1536.0" y="248.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">The credential stops at the execution layer —</tspan><tspan x="1536.0" dy="16.5">the MCP server, orchestrator or runtime — and</tspan><tspan x="1536.0" dy="16.5">never reaches the model</tspan></text></g><g><rect x="1522.0" y="309.5" width="320" height="102.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="309.5" width="4" height="102.5" fill="#378ADD"></rect><text x="1536.0" y="329.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">That keeps it out of the model’s context, not</tspan><tspan x="1536.0" dy="16.5">out of the agent’s process — removing it fully</tspan><tspan x="1536.0" dy="16.5">needs a proxy that speaks the upstream</tspan><tspan x="1536.0" dy="16.5">protocol, which Boundary covers only for SSH</tspan><tspan x="1536.0" dy="16.5">and RDP</tspan></text></g><g><rect x="1216.0" y="533.5" width="250.0" height="81.0" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.3"></rect><text x="1234.0" y="558.1" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#3C3489" text-anchor="start"><tspan x="1234.0" dy="0">Pattern B — Delegated</tspan><tspan x="1234.0" dy="18">identity chain</tspan></text><text x="1234.0" y="591.8" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#3C3489" text-anchor="start"><tspan x="1234.0" dy="0">Between agents</tspan></text></g><g><rect x="1522.0" y="515.0" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="515.0" width="4" height="53.0" fill="#7F77DD"></rect><text x="1536.0" y="535.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Each hop gets a fresh, narrower token; nested</tspan><tspan x="1536.0" dy="16.5">act claims preserve the whole chain for audit</tspan></text></g><g><rect x="1522.0" y="580.0" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="580.0" width="4" height="53.0" fill="#7F77DD"></rect><text x="1536.0" y="600.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Vault authorizes only the final hop — two hops</tspan><tspan x="1536.0" dy="16.5">proven today, longer chains are not</tspan></text></g><g><rect x="1216.0" y="869.8" width="250.0" height="63.0" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.3"></rect><text x="1234.0" y="894.4" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#085041" text-anchor="start"><tspan x="1234.0" dy="0">Pattern C — An AI gateway</tspan></text><text x="1234.0" y="910.1" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="start"><tspan x="1234.0" dy="0">For models and tools</tspan></text></g><g><rect x="1522.0" y="736.0" width="320" height="86.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="736.0" width="4" height="86.0" fill="#1D9E75"></rect><text x="1536.0" y="756.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">The gateway (IBM DataPower Interact Gateway in</tspan><tspan x="1536.0" dy="16.5">the IBM portfolio) decides what the agent is</tspan><tspan x="1536.0" dy="16.5">trying to do; Vault decides whether it may</tspan><tspan x="1536.0" dy="16.5">have the credentials</tspan></text></g><g><rect x="1522.0" y="834.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="834.0" width="4" height="69.5" fill="#1D9E75"></rect><text x="1536.0" y="854.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Variant one: the gateway holds the provider</tspan><tspan x="1536.0" dy="16.5">key and Vault issues each project a key that</tspan><tspan x="1536.0" dy="16.5">only works at the gateway</tspan></text></g><g><rect x="1522.0" y="915.5" width="320" height="86.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="915.5" width="4" height="86.0" fill="#1D9E75"></rect><text x="1536.0" y="935.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Variant two: where the provider accepts</tspan><tspan x="1536.0" dy="16.5">workload identity, the gateway federates — no</tspan><tspan x="1536.0" dy="16.5">static key, but Vault still issues the</tspan><tspan x="1536.0" dy="16.5">database and API credentials</tspan></text></g><g><rect x="1522.0" y="1013.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1013.5" width="4" height="53.0" fill="#1D9E75"></rect><text x="1536.0" y="1033.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Only an enforcement point if the caller can’t</tspan><tspan x="1536.0" dy="16.5">bypass it — needs network containment</tspan></text></g><g><rect x="1216.0" y="1204.5" width="250.0" height="81.0" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.3"></rect><text x="1234.0" y="1229.1" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#27500A" text-anchor="start"><tspan x="1234.0" dy="0">Pattern D — Secured dev</tspan><tspan x="1234.0" dy="18">environment</tspan></text><text x="1234.0" y="1262.8" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#27500A" text-anchor="start"><tspan x="1234.0" dy="0">For coding agents</tspan></text></g><g><rect x="1522.0" y="1169.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1169.5" width="4" height="69.5" fill="#639922"></rect><text x="1536.0" y="1189.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Agent, source and credentials move off the</tspan><tspan x="1536.0" dy="16.5">laptop into a brokered, short-lived managed</tspan><tspan x="1536.0" dy="16.5">workspace</tspan></text></g><g><rect x="1522.0" y="1251.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1251.0" width="4" height="69.5" fill="#639922"></rect><text x="1536.0" y="1271.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Stronger variant: the assistant gets delegated</tspan><tspan x="1536.0" dy="16.5">authorization per request, instead of holding</tspan><tspan x="1536.0" dy="16.5">a standing Vault credential</tspan></text></g><g><rect x="1216.0" y="1442.8" width="250.0" height="96.0" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1.3"></rect><text x="1234.0" y="1467.3" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#712B13" text-anchor="start"><tspan x="1234.0" dy="0">Pattern E — Runtime</tspan><tspan x="1234.0" dy="18">content guardrails</tspan></text><text x="1234.0" y="1501.0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#712B13" text-anchor="start"><tspan x="1234.0" dy="0">A behavior control, not an</tspan><tspan x="1234.0" dy="15">access control</tspan></text></g><g><rect x="1522.0" y="1423.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1423.5" width="4" height="53.0" fill="#D85A30"></rect><text x="1536.0" y="1443.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Inspects incoming and outgoing content for</tspan><tspan x="1536.0" dy="16.5">injection attempts and sensitive data</tspan></text></g><g><rect x="1522.0" y="1488.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1488.5" width="4" height="69.5" fill="#D85A30"></rect><text x="1536.0" y="1508.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Detection is probabilistic, never a guarantee</tspan><tspan x="1536.0" dy="16.5">— complements the identity patterns, doesn’t</tspan><tspan x="1536.0" dy="16.5">replace them</tspan></text></g><g><rect x="1216.0" y="1843.2" width="250.0" height="96.0" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="1.3"></rect><text x="1234.0" y="1867.8" font-family="Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#72243E" text-anchor="start"><tspan x="1234.0" dy="0">Pattern F — Workload</tspan><tspan x="1234.0" dy="18">identity</tspan></text><text x="1234.0" y="1901.5" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#72243E" text-anchor="start"><tspan x="1234.0" dy="0">Underneath most of the other</tspan><tspan x="1234.0" dy="15">patterns</tspan></text></g><g><rect x="1522.0" y="1661.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1661.0" width="4" height="69.5" fill="#D4537E"></rect><text x="1536.0" y="1681.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Platform attestation — Kubernetes, cloud or</tspan><tspan x="1536.0" dy="16.5">certificate auth methods accept the platform’s</tspan><tspan x="1536.0" dy="16.5">proof directly</tspan></text></g><g><rect x="1522.0" y="1742.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1742.5" width="4" height="69.5" fill="#D4537E"></rect><text x="1536.0" y="1762.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">SPIFFE, with Vault consuming SVIDs</tspan><tspan x="1536.0" dy="16.5">(auth/spiffe) — SPIRE issues the identity,</tspan><tspan x="1536.0" dy="16.5">Vault accepts it</tspan></text></g><g><rect x="1522.0" y="1824.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1824.0" width="4" height="69.5" fill="#D4537E"></rect><text x="1536.0" y="1844.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">SPIFFE, with Vault issuing SVIDs</tspan><tspan x="1536.0" dy="16.5">(secrets/spiffe) — for users who don’t run</tspan><tspan x="1536.0" dy="16.5">SPIRE</tspan></text></g><g><rect x="1522.0" y="1905.5" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1905.5" width="4" height="69.5" fill="#D4537E"></rect><text x="1536.0" y="1925.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Vault identity tokens — repackages an identity</tspan><tspan x="1536.0" dy="16.5">Vault already accepted, for a third system to</tspan><tspan x="1536.0" dy="16.5">check</tspan></text></g><g><rect x="1522.0" y="1987.0" width="320" height="69.5" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="1987.0" width="4" height="69.5" fill="#D4537E"></rect><text x="1536.0" y="2007.0" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">The first two establish identity from scratch;</tspan><tspan x="1536.0" dy="16.5">the last two repackage an identity Vault</tspan><tspan x="1536.0" dy="16.5">already accepted</tspan></text></g><g><rect x="1522.0" y="2068.5" width="320" height="53.0" rx="8" fill="#fffefb" stroke="#e7e3d6" stroke-width="1"></rect><rect x="1522.0" y="2068.5" width="4" height="53.0" fill="#D4537E"></rect><text x="1536.0" y="2088.5" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#3c3b35" text-anchor="start"><tspan x="1536.0" dy="0">Proves what a process is, not what it may do —</tspan><tspan x="1536.0" dy="16.5">that’s Pattern A’s job</tspan></text></g>
<text x="941.0" y="1028.2" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1" fill="#b9b6ab" text-anchor="middle">POSITIONING GUIDE</text>
<text x="941.0" y="1054.2" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#f6f5f1" text-anchor="middle">Agentic identity</text>
<text x="941.0" y="1078.2" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#cfcdc4" text-anchor="middle"><tspan x="941.0" dy="0">User phrases and six</tspan><tspan x="941.0" dy="16">patterns — what Vault does,</tspan><tspan x="941.0" dy="16">and where it stops.</tspan></text>
